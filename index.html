<head>
<meta charset="UTF-8">

<title>Djafarou Abdou</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #4ade80;
    --green-dim: #22c55e;
    --green-faint: rgba(74,222,128,0.15);
    --dark: #0a0f0a;
    --card-bg: rgba(10,20,12,0.85);
    --text: #f0f0f0;
    --muted: #9ca3af;
    --nav-bg: rgba(30,38,30,0.92);
    --tag-bg: #1a2a1a;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  #grid-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── PAGES ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 6rem;
  }

  /* ── HOME PAGE ── */

    gap: 2.5rem;
  }

  .hero-card {
    background: var(--card-bg);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: 16px;
    padding: 2.5rem 3.5rem;
    text-align: center;
    max-width: 680px;
    width: 100%;
    backdrop-filter: blur(12px);
  }

  .hero-eyebrow {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: center;
    margin-bottom: 1.2rem;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.15);
  }

  .hero-title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    color: #fff;
    margin-bottom: 1.2rem;
    line-height: 1.1;
  }

  .typing-line {
    font-size: 1rem;
    color: var(--green-dim);
    min-height: 1.5rem;
    font-family: 'Courier New', monospace;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--green);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--nav-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0.5rem 1rem;
    z-index: 100;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 0.5rem 1.2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    background: none;
    border: none;

    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

    max-width: 1200px;
    width: 100%;

    box-shadow: 0 4px 20px rgba(0,0,0,0.4);

  .card-body {

  .tags {

  .card-footer {

</style>

<script>
/* ── ANIMATED GRID ── */
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
let W, H, cols, rows, cells;

function initGrid() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const SIZE = 28, GAP = 4;
  const step = SIZE + GAP;
  cols = Math.ceil(W / step) + 1;
  rows = Math.ceil(H / step) + 1;
  cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      cells.push({
        x: c * step, y: r * step,
        s: SIZE,
        alpha: Math.random() * 0.25 + 0.03,
        target: Math.random() * 0.25 + 0.03,
        speed: Math.random() * 0.008 + 0.002
      });
    }
  }
}

function animGrid() {
  ctx.clearRect(0, 0, W, H);
  cells.forEach(cell => {
    if (Math.random() < 0.001) cell.target = Math.random() < 0.15 ? Math.random() * 0.55 + 0.2 : Math.random() * 0.08 + 0.02;
    cell.alpha += (cell.target - cell.alpha) * cell.speed;
    ctx.fillStyle = `rgba(74,222,128,${cell.alpha})`;
    const r = 3;
    const x = cell.x, y = cell.y, s = cell.s;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + s - r, y);
    ctx.quadraticCurveTo(x + s, y, x + s, y + r);
    ctx.lineTo(x + s, y + s - r);
    ctx.quadraticCurveTo(x + s, y + s, x + s - r, y + s);
    ctx.lineTo(x + r, y + s);
    ctx.quadraticCurveTo(x, y + s, x, y + s - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
  });
  requestAnimationFrame(animGrid);
}

window.addEventListener('resize', initGrid);
initGrid();
animGrid();

/* ── TYPING EFFECT ── */
const phrases = [
  "Je suis étudiant en Génie Informatique",
  "Je suis passionné par le Machine Learning",
  "Je suis Data Scientist compétiteur",
  "Je suis formateur Python",
  "Je suis jeune blogueur UNICEF",
  "Je suis membre du club robotique",
  "Je suis 1er en détection d'intrusion réseau"
];
let pi = 0, ci = 0, deleting = false;
const el = document.getElementById('typing-text');

function type() {
  const phrase = phrases[pi];
  const cursor = '<span class="cursor"></span>';
  if (!deleting) {
    ci++;
    el.innerHTML = phrase.slice(0, ci) + cursor;
    if (ci === phrase.length) { deleting = true; setTimeout(type, 2200); return; }
    setTimeout(type, 55);
  } else {
    ci--;
    el.innerHTML = phrase.slice(0, ci) + cursor;
    if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(type, 400); return; }
    setTimeout(type, 28);
  }
}
setTimeout(type, 800);

/* ── PAGE NAVIGATION ── */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  const btn = document.getElementById('nav-' + id);
  if (btn) btn.classList.add('active');
}

function makeScreen(accent) {
  return `
    <div class="card-thumb-inner">
      <div class="screen-bar">
        <div class="screen-dot" style="background:#ef4444"></div>

      <div class="screen-line green" style="background:${accent}44;width:40%"></div>

}

function renderProjects(list) {
  const grid = document.getElementById('projects-grid');
  grid.innerHTML = list.map(p => `
    <div class="project-card" data-name="${p.name.toLowerCase()}" data-tags="${p.tags.join(' ').toLowerCase()}">
      <div class="card-thumb" style="background:${p.color}">
        ${makeScreen(p.accent)}
      </div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <a class="card-footer" href="${p.link}" target="_blank">Voir plus</a>
    </div>
  `).join('');
}

function filterProjects() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = projects.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.tags.some(t => t.toLowerCase().includes(q))
  );
  renderProjects(filtered);
}

renderProjects(projects);
</script>
