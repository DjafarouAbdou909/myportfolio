<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Djafarou Abdou</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #4ade80;
    --green-dim: #22c55e;
    --green-faint: rgba(74,222,128,0.15);
    --dark: #0a0f0a;
    --card-bg: rgba(10,20,12,0.85);
    --text: #f0f0f0;
    --muted: #9ca3af;
    --nav-bg: rgba(30,38,30,0.92);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  #grid-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── PAGES ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 6rem;
  }
  .page.active { display: flex; }

  /* ── LANGUAGE SELECTOR ── */
  #lang-page {
    gap: 2rem;
    background: var(--dark);
  }

  .lang-card {
    background: var(--card-bg);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: 20px;
    padding: 3rem 4rem;
    text-align: center;
    max-width: 500px;
    width: 100%;
    backdrop-filter: blur(12px);
  }

  .lang-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    color: #fff;
    margin-bottom: 0.5rem;
  }

  .lang-subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 2.5rem;
  }

  .lang-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .lang-btn {
    padding: 0.85rem 2.2rem;
    border-radius: 12px;
    border: 2px solid rgba(74,222,128,0.5);
    background: rgba(74,222,128,0.08);
    color: var(--green);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .lang-btn:hover {
    background: rgba(74,222,128,0.2);
    border-color: var(--green);
    transform: translateY(-2px);
  }
  .lang-btn .flag { font-size: 1.4rem; }

  /* ── HOME PAGE ── */
  #home { gap: 2.5rem; }

  .hero-card {
    background: var(--card-bg);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: 16px;
    padding: 2.5rem 3.5rem;
    text-align: center;
    max-width: 680px;
    width: 100%;
    backdrop-filter: blur(12px);
  }

  .hero-eyebrow {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: center;
    margin-bottom: 1.2rem;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.15);
  }

  .hero-title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    color: #fff;
    margin-bottom: 1.2rem;
    line-height: 1.1;
  }

  .typing-line {
    font-size: 1rem;
    color: var(--green-dim);
    min-height: 1.5rem;
    font-family: 'Courier New', monospace;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--green);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--nav-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0.5rem 1rem;
    z-index: 100;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 0.5rem 1.2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    background: none;
    border: none;
  }
  .nav-item:hover, .nav-item.active {
    color: var(--text);
    background: rgba(255,255,255,0.08);
  }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
  }

  .nav-center-dot {
    width: 40px; height: 40px;
    background: rgba(100,100,100,0.5);
    border-radius: 50%;
    margin: 0 0.5rem;
    flex-shrink: 0;
  }

  /* ── PROJECTS PAGE ── */
  #projects {
    padding-top: 4rem;
    justify-content: flex-start;
    padding-bottom: 7rem;
  }

  .section-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .section-header h2 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
  }
  .section-header p {
    color: var(--muted);
    margin-top: 0.5rem;
    font-size: 0.95rem;
  }
  .section-header em {
    font-style: italic;
    font-size: 0.85rem;
    color: #6b7280;
    display: block;
    margin-top: 0.25rem;
  }

  .search-bar {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    max-width: 560px;
    width: 100%;
    margin: 0 auto 2.5rem;
    gap: 0.6rem;
  }
  .search-bar input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.9rem;
    flex: 1;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-bar svg { color: var(--muted); width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    width: 100%;
  }

  .project-card {
    background: #f0f0ee;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  .card-thumb {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Badge on thumb */
  .card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    text-transform: uppercase;
  }
  .card-badge.gold { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,0.12); }
  .card-badge.live { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.12); }
  .card-badge.finalist { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.12); }
  .card-badge.silver { border-color: #94a3b8; color: #cbd5e1; background: rgba(148,163,184,0.12); }

  .card-thumb-inner {
    width: 68%;
    background: #1a1a2e;
    border-radius: 8px;
    padding: 0.8rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .screen-bar { display: flex; gap: 4px; margin-bottom: 6px; }
  .screen-dot { width: 6px; height: 6px; border-radius: 50%; }
  .screen-line { height: 6px; border-radius: 3px; margin: 4px 0; background: rgba(255,255,255,0.1); }

  .card-body {
    padding: 1.2rem 1.2rem 0.5rem;
    flex: 1;
    color: #111;
  }
  .card-body h3 {
    font-size: 1rem;
    font-weight: 800;
    color: #111;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 0.82rem;
    color: #444;
    line-height: 1.55;
    margin-bottom: 0.8rem;
  }

  .tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 0.8rem;
  }
  .tag {
    background: #111;
    color: #fff;
    border-radius: 999px;
    font-size: 0.7rem;
    padding: 3px 10px;
    font-weight: 500;
  }

  .card-footer {
    background: var(--green-dim);
    text-align: center;
    padding: 0.6rem;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: #fff;
    text-decoration: none;
    display: block;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .card-footer:hover { background: #16a34a; }

  /* Lang switcher pill inside app */
  .lang-switch {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 200;
    display: flex;
    background: var(--nav-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    overflow: hidden;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .lang-switch button {
    padding: 0.4rem 0.9rem;
    font-size: 0.72rem;
    font-weight: 700;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    letter-spacing: 0.06em;
  }
  .lang-switch button.active-lang {
    background: rgba(74,222,128,0.15);
    color: var(--green);
  }

  @media (max-width: 600px) {
    .hero-card { padding: 2rem 1.5rem; }
    .lang-card { padding: 2rem 1.5rem; }
    .projects-grid { grid-template-columns: 1fr; }
    .nav-item { padding: 0.5rem 0.8rem; font-size: 0.65rem; }
    .lang-switch { top: 0.7rem; right: 0.7rem; }
  }

  /* ── PROOF MODAL ── */
  .proof-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .proof-overlay.open { display: flex; }
  .proof-box {
    background: #1a1a2e;
    border: 1px solid rgba(74,222,128,0.4);
    border-radius: 14px;
    overflow: hidden;
    max-width: 900px;
    width: 100%;
    position: relative;
  }
  .proof-box img {
    width: 100%;
    display: block;
  }
  .proof-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: #fff;
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
    opacity: 0.8;
  }
  .proof-close:hover { opacity: 1; }
  .proof-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(245,158,11,0.15);
    border: 1px solid #f59e0b;
    color: #f59e0b;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 12px;
    cursor: pointer;
    margin-bottom: 0.6rem;
    transition: background 0.2s;
    letter-spacing: 0.05em;
    text-decoration: none;
  }
  .proof-btn:hover { background: rgba(245,158,11,0.3); }
  .proof-btn.live { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); }
  .proof-btn.live:hover { background: rgba(74,222,128,0.25); }

</style>
</head>
<body>

<canvas id="grid-canvas"></canvas>

<!-- ══ PROOF MODAL ══ -->
<div class="proof-overlay" id="proof-overlay" onclick="closeProof(event)">
  <div class="proof-box">
    <button class="proof-close" onclick="document.getElementById('proof-overlay').classList.remove('open')">×</button>
    <img id="proof-img" src="" alt="Preuve">
  </div>
</div>


<!-- ══ LANGUAGE SELECTOR PAGE ══ -->
<section class="page active" id="lang-page">
  <div class="lang-card">
    <div class="lang-title">Djafarou Abdou</div>
    <p class="lang-subtitle">Please choose your language / Choisissez votre langue</p>
    <div class="lang-buttons">
      <button class="lang-btn" onclick="setLang('fr')">
        <span class="flag">🇫🇷</span> Français
      </button>
      <button class="lang-btn" onclick="setLang('en')">
        <span class="flag">🇬🇧</span> English
      </button>
    </div>
  </div>
</section>

<!-- ══ HOME PAGE ══ -->
<section class="page" id="home">
  <div class="hero-card">
    <div class="hero-eyebrow" id="eyebrow-text">PORTEFEUILLE</div>
    <h1 class="hero-title" id="hero-greeting">Bonjour, je suis Abdou !</h1>
    <p class="typing-line" id="typing-text"><span class="cursor"></span></p>
  </div>
</section>

<!-- ══ PROJECTS PAGE ══ -->
<section class="page" id="projects">
  <div class="section-header">
    <h2 id="proj-title">Mon Travail</h2>
    <p id="proj-sub">Voici quelques-uns des projets sur lesquels j'ai travaillé.</p>
    <em id="proj-note">Certains liens peuvent être en cours de développement.</em>
  </div>

  <div class="search-bar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

  </div>

  <div class="projects-grid" id="projects-grid"></div>
</section>

<!-- ══ LANG SWITCH PILL (shown after lang selection) ══ -->
<div class="lang-switch" id="lang-switch" style="display:none;">
  <button id="btn-fr" onclick="setLang('fr')">FR</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
</div>

<!-- ══ BOTTOM NAV ══ -->
<nav class="bottom-nav" id="bottom-nav" style="display:none;">
  <button class="nav-item active" id="nav-home" onclick="showPage('home')">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span id="nav-label-home">Maison</span>
  </button>
  <button class="nav-item" id="nav-projects" onclick="showPage('projects')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span id="nav-label-projects">Projets</span>
  </button>
  <a class="nav-item" href="https://drive.google.com/file/d/1nrPyNt77oCeD42rb2X9FLRs-qKz9PNWu/view?usp=sharing" target="_blank">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
    CV
  </a>
  <div class="nav-center-dot"></div>
  <a class="nav-item" href="https://www.linkedin.com/in/djafarou/" target="_blank">
    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="8" y1="11" x2="8" y2="17"/><line x1="8" y1="7" x2="8" y2="8"/><path d="M12 11v6M12 11a3 3 0 016 0v6"/></svg>
    LinkedIn
  </a>
  <a class="nav-item" href="https://github.com/DjafarouAbdou909" target="_blank">

</nav>

/* ── TRANSLATIONS ── */
const i18n = {

    navHome: 'Maison',
    navProjects: 'Projets',
    viewMore: 'Voir plus',

  en: {

    projTitle: 'My Work',

  }

/* ── PROJECTS DATA (bilingual) ── */
const projects = [

/* ── ANIMATED GRID ── */
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
let W, H, cells;

function initGrid() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const SIZE = 28, GAP = 4, step = SIZE + GAP;
  const cols = Math.ceil(W / step) + 1;
  const rows = Math.ceil(H / step) + 1;
  cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      cells.push({
        x: c * step, y: r * step, s: SIZE,
        alpha: Math.random() * 0.25 + 0.03,
        target: Math.random() * 0.25 + 0.03,
        speed: Math.random() * 0.008 + 0.002
      });
    }
  }
}

function animGrid() {
  ctx.clearRect(0, 0, W, H);
  cells.forEach(cell => {
    if (Math.random() < 0.001) cell.target = Math.random() < 0.15 ? Math.random() * 0.55 + 0.2 : Math.random() * 0.08 + 0.02;
    cell.alpha += (cell.target - cell.alpha) * cell.speed;
    ctx.fillStyle = `rgba(74,222,128,${cell.alpha})`;
    const r = 3, x = cell.x, y = cell.y, s = cell.s;
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+s-r,y); ctx.quadraticCurveTo(x+s,y,x+s,y+r);
    ctx.lineTo(x+s,y+s-r); ctx.quadraticCurveTo(x+s,y+s,x+s-r,y+s);
    ctx.lineTo(x+r,y+s); ctx.quadraticCurveTo(x,y+s,x,y+s-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.fill();
  });
  requestAnimationFrame(animGrid);
}

window.addEventListener('resize', initGrid);
initGrid();
animGrid();

/* ── TYPING EFFECT ── */
let typingTimeout = null;
let typingPhrases = [];
let pi = 0, ci = 0, deleting = false;
const el = document.getElementById('typing-text');

function startTyping(phrases) {
  typingPhrases = phrases;
  pi = 0; ci = 0; deleting = false;
  if (typingTimeout) clearTimeout(typingTimeout);
  type();
}

function type() {
  const phrase = typingPhrases[pi];
  const cursor = '<span class="cursor"></span>';
  if (!deleting) {
    ci++;
    el.innerHTML = phrase.slice(0, ci) + cursor;
    if (ci === phrase.length) { deleting = true; typingTimeout = setTimeout(type, 2200); return; }
    typingTimeout = setTimeout(type, 55);
  } else {
    ci--;
    el.innerHTML = phrase.slice(0, ci) + cursor;
    if (ci === 0) { deleting = false; pi = (pi + 1) % typingPhrases.length; typingTimeout = setTimeout(type, 400); return; }
    typingTimeout = setTimeout(type, 28);
  }
}

/* ── PAGE NAVIGATION ── */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const btn = document.getElementById('nav-' + id);
  if (btn) btn.classList.add('active');
}

function renderProjects(list) {

      : '';
    return `
    <div class="project-card" data-name="${p.name[currentLang].toLowerCase()}" data-tags="${p.tags.join(' ').toLowerCase()}">
      <div class="card-thumb" style="background:${p.color}">
        ${makeScreen(p.accent)}
        ${badgeHtml}
      </div>
      <div class="card-body">
        <h3>${p.name[currentLang]}</h3>
        <p class="card-desc">${p.desc[currentLang]}</p>
        <div class="tags">${p.tags.map(tg => `<span class="tag">${tg}</span>`).join('')}</div>
      </div>
      <div style="padding: 0 1.2rem 0.8rem; background:#f0f0ee;">
        ${p.proof && p.proof.type === 'base64' ? '<button class=\'proof-btn\' onclick=\'openProof(event, \"' + (p.proof ? p.proof.src : '') + '\")\'>🏆 Voir le classement</button>' : ''}

      <a class="card-footer" href="${p.link}" target="_blank">${t.viewMore}</a>
    </div>`;
  }).join('');
}

function filterProjects() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = projects.filter(p =>
    p.name[currentLang].toLowerCase().includes(q) ||
    p.tags.some(tg => tg.toLowerCase().includes(q)) ||
    p.desc[currentLang].toLowerCase().includes(q)
  );
  renderProjects(filtered);
}


function openProof(e, src) {
  e.stopPropagation();
  document.getElementById('proof-img').src = src;
  document.getElementById('proof-overlay').classList.add('open');
}
function closeProof(e) {
  if (e.target.id === 'proof-overlay') {
    document.getElementById('proof-overlay').classList.remove('open');
  }
}
