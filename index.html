  :root {

    --green-faint: rgba(74,222,128,0.15);
    --dark: #0a0f0a;
    --card-bg: rgba(10,20,12,0.85);

    --nav-bg: rgba(30,38,30,0.92);
  }

  html { scroll-behavior: smooth; }

  body {

    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #grid-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 6rem;
  }
  .page.active { display: flex; }

  #home { gap: 2.5rem; }

  .hero-card {
    background: var(--card-bg);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: 16px;
    padding: 2.5rem 3.5rem;
    text-align: center;
    max-width: 680px;
    width: 100%;
    backdrop-filter: blur(12px);
  }

  .hero-eyebrow {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: center;
    margin-bottom: 1.2rem;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.15);
  }

  .hero-title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    color: #fff;
    margin-bottom: 1.2rem;
    line-height: 1.1;
  }

  .typing-line {
    font-size: 1rem;
    color: var(--green-dim);
    min-height: 1.5rem;
    font-family: 'Courier New', monospace;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--green);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .bottom-nav {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--nav-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0.5rem 1rem;
    z-index: 100;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 0.5rem 1.2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    background: none;
    border: none;
  }
  .nav-item:hover, .nav-item.active {
    color: var(--text);
    background: rgba(255,255,255,0.08);
  }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
  }

  .nav-center-dot {
    width: 40px; height: 40px;
    background: rgba(100,100,100,0.5);
    border-radius: 50%;
    margin: 0 0.5rem;
    flex-shrink: 0;
  }

  #projects {
    padding-top: 4rem;
    justify-content: flex-start;
    padding-bottom: 7rem;
  }

  .section-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .section-header h2 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
  }
  .section-header p {
    color: var(--muted);
    margin-top: 0.5rem;
    font-size: 0.95rem;
  }
  .section-header em {
    font-style: italic;
    font-size: 0.85rem;
    color: #6b7280;
    display: block;
    margin-top: 0.25rem;
  }

  .search-bar {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    max-width: 560px;
    width: 100%;
    margin: 0 auto 2.5rem;
    gap: 0.6rem;
  }
  .search-bar input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.9rem;
    flex: 1;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-bar svg { color: var(--muted); width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    width: 100%;

  .project-card {
    background: #f0f0ee;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;

  .project-card:hover {

  }

    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-height: 80px;
  }

  .card-thumb img {
    width: 100%;
    height: auto;
    display: block;
  }

  .card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    text-transform: uppercase;

  .card-badge.live { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.12); }
  .card-badge.finalist { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.12); }
  .card-badge.silver { border-color: #94a3b8; color: #cbd5e1; background: rgba(148,163,184,0.12); }

  .card-thumb-inner {
    width: 68%;
    background: #1a1a2e;
    border-radius: 8px;
    padding: 0.8rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);

  .screen-dot { width: 6px; height: 6px; border-radius: 50%; }
  .screen-line { height: 6px; border-radius: 3px; margin: 4px 0; background: rgba(255,255,255,0.1); }

  .card-body {
    padding: 1.2rem 1.2rem 0.5rem;
    flex: 1;
    color: #111;
  }
  .card-body h3 {
    font-size: 1rem;
    font-weight: 800;
    color: #111;
    margin-bottom: 0.5rem;
    line-height: 1.3;

  .card-desc {

    color: #444;
    line-height: 1.55;
    margin-bottom: 0.8rem;

  .tags {

  .tag {

    color: #fff;
    border-radius: 999px;

  .lang-switch {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 200;
    display: flex;
    background: var(--nav-bg);
    border: 1px solid rgba(255,255,255,0.1);

    font-size: 0.72rem;
    font-weight: 700;
    border: none;
    background: none;
    color: var(--muted);

    .nav-item { padding: 0.5rem 0.8rem; font-size: 0.65rem; }

</head>

/* ── ANIMATED GRID ── */
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
let W, H, cells;

function initGrid() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const SIZE = 28, GAP = 4, step = SIZE + GAP;
  const cols = Math.ceil(W / step) + 1;
  const rows = Math.ceil(H / step) + 1;
  cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      cells.push({
        x: c * step, y: r * step, s: SIZE,
        alpha: Math.random() * 0.25 + 0.03,
        target: Math.random() * 0.25 + 0.03,
        speed: Math.random() * 0.008 + 0.002
      });
    }
  }
}

function animGrid() {
  ctx.clearRect(0, 0, W, H);
  cells.forEach(cell => {
    if (Math.random() < 0.001) cell.target = Math.random() < 0.15 ? Math.random() * 0.55 + 0.2 : Math.random() * 0.08 + 0.02;
    cell.alpha += (cell.target - cell.alpha) * cell.speed;
    ctx.fillStyle = `rgba(74,222,128,${cell.alpha})`;
    const r = 3, x = cell.x, y = cell.y, s = cell.s;
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+s-r,y); ctx.quadraticCurveTo(x+s,y,x+s,y+r);
    ctx.lineTo(x+s,y+s-r); ctx.quadraticCurveTo(x+s,y+s,x+s-r,y+s);
    ctx.lineTo(x+r,y+s); ctx.quadraticCurveTo(x,y+s,x,y+s-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.fill();
  });
  requestAnimationFrame(animGrid);
}

window.addEventListener('resize', initGrid);
initGrid();
animGrid();

/* ── TYPING EFFECT ── */
let typingTimeout = null;
let typingPhrases = [];
let pi = 0, ci = 0, deleting = false;
const el = document.getElementById('typing-text');

function startTyping(phrases) {
  typingPhrases = phrases;
  pi = 0; ci = 0; deleting = false;
  if (typingTimeout) clearTimeout(typingTimeout);
  type();
}

function type() {
  const phrase = typingPhrases[pi];
  const cursor = '<span class="cursor"></span>';
  if (!deleting) {
    ci++;
    el.innerHTML = phrase.slice(0, ci) + cursor;
    if (ci === phrase.length) { deleting = true; typingTimeout = setTimeout(type, 2200); return; }
    typingTimeout = setTimeout(type, 55);
  } else {
    ci--;
    el.innerHTML = phrase.slice(0, ci) + cursor;
    if (ci === 0) { deleting = false; pi = (pi + 1) % typingPhrases.length; typingTimeout = setTimeout(type, 400); return; }
    typingTimeout = setTimeout(type, 28);
  }
}

/* ── PAGE NAVIGATION ── */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const btn = document.getElementById('nav-' + id);
  if (btn) btn.classList.add('active');
}

function makeScreen(accent) {
  return `
    <div class="card-thumb-inner">
      <div class="screen-bar">
        <div class="screen-dot" style="background:#ef4444"></div>
        <div class="screen-dot" style="background:#f59e0b"></div>
        <div class="screen-dot" style="background:#22c55e"></div>
      </div>
      <div class="screen-line" style="background:${accent}55;width:80%"></div>
      <div class="screen-line" style="width:100%"></div>
      <div class="screen-line" style="width:65%"></div>
      <div class="screen-line" style="background:${accent}33;width:90%"></div>
      <div class="screen-line" style="width:50%"></div>
      <div class="screen-line" style="width:75%"></div>
      <div class="screen-line" style="background:${accent}44;width:40%"></div>
    </div>`;
}

function renderProjects(list) {
  const t = i18n[currentLang];
  const grid = document.getElementById('projects-grid');
  grid.innerHTML = list.map(p => {
    const badgeHtml = p.badge
      ? `<div class="card-badge ${p.badge.type}">${p.badge[currentLang]}</div>`
      : '';
    const thumbContent = p.img
      ? `<img src="${p.img}" alt="${p.name[currentLang]}" loading="lazy">`
      : `<div style="height:180px;display:flex;align-items:center;justify-content:center;width:100%">${makeScreen(p.accent)}</div>`;
    return `
    <div class="project-card" data-name="${p.name[currentLang].toLowerCase()}" data-tags="${p.tags.join(' ').toLowerCase()}">
      <div class="card-thumb" style="background:${p.color}">
        ${thumbContent}
        ${badgeHtml}
      </div>
      <div class="card-body">
        <h3>${p.name[currentLang]}</h3>
        <p class="card-desc">${p.desc[currentLang]}</p>
        <div class="tags">${p.tags.map(tg => `<span class="tag">${tg}</span>`).join('')}</div>
      </div>
      <a class="card-footer" href="${p.link}" target="_blank">${t.viewMore}</a>
    </div>`;
  }).join('');
}

function filterProjects() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = projects.filter(p =>
    p.name[currentLang].toLowerCase().includes(q) ||
    p.tags.some(tg => tg.toLowerCase().includes(q)) ||
    p.desc[currentLang].toLowerCase().includes(q)
  );
  renderProjects(filtered);
}
